name: Refresh homepage videos

# Keeps the featured-videos block on docs/index.html in step with the
# latest uploads on the YouTube channel.
#
# Needs a YOUTUBE_API_KEY repository secret: a free YouTube Data API v3
# key. Scraping the channel page instead does not work from here —
# YouTube serves runner IPs a page with the video data stripped out — so
# without the key the job warns and leaves the homepage alone. A daily
# refresh costs about 3 of the 10,000 free quota units.
#
# To set it up: Google Cloud console -> enable "YouTube Data API v3" ->
# Credentials -> Create credentials -> API key, then add it to this repo
# under Settings -> Secrets and variables -> Actions as YOUTUBE_API_KEY.

on:
  schedule:
    # 07:17 UTC daily. Deliberately off the hour: scheduled jobs that ask
    # for :00 queue behind everyone else's and get delayed.
    - cron: "17 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-homepage-videos
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check the parsers
        run: python scripts/test_update_youtube.py

      - name: Refresh the featured videos
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/update_youtube.py

      - name: Commit if anything changed
        run: |
          if [ -z "$(git status --porcelain docs/index.html)" ]; then
            echo "Homepage already current — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git commit -m "Refresh homepage featured videos from the YouTube feed"
          git push
